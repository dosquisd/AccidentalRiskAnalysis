services:
  traefik:
    image: traefik:v3.6
    restart: always
    command:
      # Enable Docker in Traefik and don't expose all service by default
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      # Listen HTTP/HTTPS traffic
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443

      # TLS Certificates with Let's Encrypt
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL?Variable not set}
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json

      - --accesslog
      - --log
      - --api
      - --api.dashboard=true
    ports:
      # Listen port 80, default for HTTP traffic. Then will be redirected to HTTPS
      - 80:80
      # Listen port 443, default for HTTPS traffic
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-public-certificates:/certificates
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public

      # Traefik dashboard service
      - traefik.http.services.traefik-dashboard.loadbalancer.server.port=8080

      - traefik.http.routers.traefik-dashboard-http.entrypoints=http
      - traefik.http.routers.traefik-dashboard-http.rule=Host(`traefik.${DOMAIN?Variable not set}`)

      - traefik.http.routers.traefik-dashboard-https.entrypoints=https
      - traefik.http.routers.traefik-dashboard-https.rule=Host(`traefik.${DOMAIN?Variable not set}`)
      - traefik.http.routers.traefik-dashboard-https.tls=true
      - traefik.http.routers.traefik-dashboard-https.tls.certresolver=le
      - traefik.http.routers.traefik-dashboard-https.service=api@internal

      # https-redirect middleware to redirect HTTP to HTTPS
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true

      # traefik-http set up only to use the middleware to redirect to https
      - traefik.http.routers.traefik-dashboard-http.middlewares=https-redirect

      - traefik.http.middlewares.admin-auth.basicauth.users=${USERNAME?Variable not set}:${HASHED_PASSWORD?Variable not set}
      # Enable HTTP Basic auth, using the middleware created above
      - traefik.http.routers.traefik-dashboard-https.middlewares=admin-auth

  dashboard:
    image: dosquisd/bogota-accidents-dashboard:latest
    restart: unless-stopped
    networks:
      - traefik-public
    volumes:
      - dashboard-data:/app/dashboard/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.dashboard.loadbalancer.server.port=8501

      # Allow HTTP traffic
      - traefik.http.routers.dashboard-http.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.dashboard-http.entrypoints=http

      # Allow HTTPS traffic
      - traefik.http.routers.dashboard-https.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.dashboard-https.entrypoints=https
      - traefik.http.routers.dashboard-https.tls=true
      - traefik.http.routers.dashboard-https.tls.certresolver=le

      # Redirect HTTP to HTTPS
      - traefik.http.routers.dashboard-http.middlewares=https-redirect

volumes:
  dashboard-data:
  traefik-public-certificates:

networks:
  traefik-public:
    driver: bridge
